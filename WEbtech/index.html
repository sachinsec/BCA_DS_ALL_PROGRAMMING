<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App with Auth</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Todo List</h1>
        
        <!-- User Info - hidden until logged in -->
        <div id="userInfo" class="section hidden">
            Welcome, <span id="currentUsername"></span> | <button id="logoutBtn">Logout</button>
        </div>
        
        <!-- Todo Section - hidden until logged in -->
        <div id="todoSection" class="section hidden">
            <div class="input-section">
                <input type="text" id="todoInput" placeholder="Enter a new todo...">
                <button id="addBtn">Add Todo</button>
            </div>
            <ul id="todoList"></ul>
        </div>
        
        <!-- Auth Section - visible initially -->
        <div id="authSection" class="section">
            <div id="toggleLinks">
                <span class="toggle-link active" data-form="signup">Sign Up</span> | 
                <span class="toggle-link" data-form="login">Login</span>
            </div>
            
            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <input type="text" id="signupUsername" placeholder="Username" required>
                <input type="password" id="signupPassword" placeholder="Password" required>
                <button type="submit">Sign Up</button>
            </form>
            
            <!-- Login Form -->
            <form id="loginForm" class="auth-form hidden">
                <input type="text" id="loginUsername" placeholder="Username" required>
                <input type="password" id="loginPassword" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
